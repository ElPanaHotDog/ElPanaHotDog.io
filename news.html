<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fall Guys News</title>

<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Asap:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    font-family:'Asap',sans-serif;
    color:white;

    cursor:url("cursor.png"),auto;

    background:linear-gradient(
        to bottom,
        #7b4dff,
        #9c91ff
    );

    min-height:100vh;

    overflow-x:hidden;

    position:relative;

}

/* Fondo */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background-image:url("S12_Pattern.png");

    background-size:200px;

    background-repeat:repeat;

    opacity:.15;

    animation:moveBackground 20s linear infinite;

    pointer-events:none;

    z-index:0;

}

@keyframes moveBackground{

from{

background-position:0 0;

}

to{

background-position:400px 400px;

}

}

/* Todo el contenido */

.container{

    position:relative;

    z-index:5;

    width:min(1300px,92%);

    margin:auto;

    padding-top:70px;

    padding-bottom:80px;

}

/* Cabecera */

.header{

    text-align:center;

    margin-bottom:60px;

}

.header h1{

    margin:0;

    font-family:'Titan One',cursive;

    font-size:clamp(48px,7vw,88px);

    color:white;

    -webkit-text-stroke:5px #ff69cf;

    paint-order:stroke fill;

    letter-spacing:1px;

}

.header p{

    max-width:760px;

    margin:18px auto 0;

    font-size:22px;

    line-height:1.6;

    font-weight:700;

}

/* Grid (las tarjetas las haremos después) */

.news-grid{

    display:grid;

    grid-template-columns:repeat(2,minmax(320px,1fr));

    gap:42px;

}

/* Responsive */

@media(max-width:900px){

.news-grid{

grid-template-columns:1fr;

}

.header{

margin-bottom:45px;

}

.header p{

font-size:19px;

}

.container{

width:94%;

padding-top:50px;

}

}

</style>

</head>

<body>

<main class="container">

<header class="header">

<h1>News</h1>

<p>

All the latest Fall Guys happenings,
direct from the Blunderdome Construction Crew!

</p>

</header>

<section
id="newsContainer"
class="news-grid">

<!-- news.js añadirá aquí las noticias -->

</section>

</main>

<audio id="hoverS" src="PopUp.wav"></audio>
<audio id="clickS" src="Accept.wav"></audio>

<script src="main/js/news.js"></script>

</body>
</html>
