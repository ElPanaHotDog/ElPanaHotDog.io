<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>News | El Pana Hot Dog</title>

<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Asap:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    font-family:'Asap',sans-serif;
    color:white;

    cursor:url("cursor.png"),auto;

    background:linear-gradient(
        180deg,
        #7850ff 0%,
        #8b79ff 55%,
        #9fa4ff 100%
    );

    min-height:100vh;

    overflow-x:hidden;

    position:relative;

}

/* Fondo */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background-image:url("S12_Pattern.png");

    background-repeat:repeat;

    background-size:200px;

    opacity:.15;

    animation:moveBackground 20s linear infinite;

    pointer-events:none;

    z-index:0;

}

@keyframes moveBackground{

from{

background-position:0 0;

}

to{

background-position:400px 400px;

}

}

/* Contenedor */

.container{

    position:relative;

    z-index:5;

    width:min(1450px,92%);

    margin:auto;

    padding-top:90px;

    padding-bottom:80px;

}

/* Cabecera */

.header{

    text-align:center;

    margin-bottom:55px;

}

.header h1{

    margin:0;

    font-family:'Titan One',cursive;

    font-size:clamp(42px,5vw,72px);

    color:white;

    -webkit-text-stroke:4px #ff5cb9;

    paint-order:stroke fill;

    letter-spacing:.5px;

    margin-bottom:18px;

}

.header p{

    max-width:690px;

    margin:0 auto;

    font-size:24px;

    line-height:1.45;

    font-weight:700;

}

/* Grid */

.news-grid{

    display:grid;

    grid-template-columns:repeat(2,minmax(340px,1fr));

    gap:58px 42px;

}

/* Responsive */

@media(max-width:900px){

.news-grid{

    grid-template-columns:1fr;

    gap:42px;

}

.header{

    margin-bottom:45px;

}

.header h1{

    font-size:56px;

    -webkit-text-stroke:3px #ff5cb9;

}

.header p{

    font-size:20px;

    max-width:100%;

}

.container{

    width:94%;

    padding-top:60px;

}

}

</style>

</head>
<body>

<main class="container">

<header class="header">

<h1>News</h1>

<p>

All the latest Fall Guys happenings,
direct from the Blunderdome Construction Crew!

</p>

</header>

<section
id="newsContainer"
class="news-grid">

<!-- News cards will be inserted by news.js -->

</section>

</main>

<audio id="hoverS" src="PopUp.wav"></audio>
<audio id="clickS" src="Accept.wav"></audio>

<script src="main/js/news.js"></script>

</body>

</html>
