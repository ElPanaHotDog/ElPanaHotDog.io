<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="Icon.png">

<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Asap:wght@700&display=swap" rel="stylesheet">

<title>Free Cam</title>

    <!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Free Cam">
<meta property="og:description" content="Explore maps and take High Quality Screenshots with this Mod!">
<meta property="og:image" content="https://elpanahotdog.github.io/ElPanaHotDog.io/OGImage.png">
<meta property="og:url" content="https://elpanahotdog.github.io/ElPanaHotDog.io/">
<meta property="og:site_name" content="Free Cam">

<!-- Discord -->
<meta name="theme-color" content="#a056ff">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Free Cam">
<meta name="twitter:description" content="Explore maps and take High Quality Screenshots with this Mod!">
<meta name="twitter:image" content="https://elpanahotdog.github.io/ElPanaHotDog.io/OGImage.png">

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;
    justify-content:flex-start;
    align-items:center;
    flex-direction:column;

    font-family:'Asap',sans-serif;

    color:white;

    background:linear-gradient(to bottom,#a056ff,#a098ff);

    cursor:url("cursor.png"),auto;

    position:relative;

    overflow-x:hidden;

}


body::before{

    content:"";

    position:fixed;

    inset:0;

    background-image:url("S12_Pattern.png");

    background-repeat:repeat;

    background-size:200px;

    opacity:0.15;

    animation:move 20s linear infinite;

    pointer-events:none;

    z-index:0;

}


@keyframes move{

    from{
        background-position:0 0;
    }

    to{
        background-position:400px 400px;
    }

}


.content{

    position:relative;

    z-index:2;

    width:100%;

    max-width:1100px;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:60px 20px 80px;

}



h1{

    margin:0;

    font-family:'Titan One',sans-serif;

    font-size:78px;

    color:white;


    /* Contorno exterior rosa */

    text-shadow:

    -5px -5px 0 #ff4fc6,
    -5px  0px 0 #ff4fc6,
    -5px  5px 0 #ff4fc6,

     0px -5px 0 #ff4fc6,
     0px  5px 0 #ff4fc6,

     5px -5px 0 #ff4fc6,
     5px  0px 0 #ff4fc6,
     5px  5px 0 #ff4fc6,

     0 0 20px rgba(255,79,198,.4);

}



.subtitle{

    margin-top:10px;

    margin-bottom:35px;

    font-size:22px;

    color:#ffffffdd;

    text-align:center;

}



.buttons{

    display:flex;

    gap:20px;

    flex-wrap:wrap;

    justify-content:center;

}



.download{

    padding:18px 45px;

    border:none;

    border-radius:16px;


    background:#00d4ff;

    color:#111;


    font-family:'Asap',sans-serif;

    font-size:24px;

    font-weight:700;


    cursor:url("cursor.png"),auto;


    transition:.2s;

}



.download:hover{

    transform:scale(1.08);

}



.gallery{

    width:100%;

    margin-top:60px;


    display:flex;

    flex-direction:column;

    gap:40px;

}



.gallery img{

    width:100%;

    border-radius:22px;

    border:5px solid rgba(255,255,255,.25);


    box-shadow:0 15px 35px rgba(0,0,0,.25);


    transition:.25s;

}



.gallery img:hover{

    transform:scale(1.02);

}
.hero{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:70px;

    margin-bottom:60px;

}

.hero-left{

    display:flex;

    flex-direction:column;

    align-items:center;

}

.hero-render{

    width:320px;

    max-width:22vw;

    margin-left:180px;

    pointer-events:none;

    user-select:none;

    filter:drop-shadow(0 20px 35px rgba(0,0,0,.35));


}


@media(max-width:700px){
.hero{

    flex-direction:column;

}

.hero-render{

    display:none;

}

    h1{

        font-size:54px;

    }


    .download{

        font-size:20px;

    }

}
</style>

</head>

<body>


<div class="content">

    <div class="hero">

        <div class="hero-left">


    <h1>Free Cam</h1>


    <p class="subtitle">
        Explore maps and take High Quality Screenshots with this Mod!
    </p>



    <div class="buttons">


        <button class="download"

        onmouseenter="
        document.getElementById('hoverS').currentTime=0;
        document.getElementById('hoverS').play().catch(()=>{})
        "

        onclick="
        document.getElementById('clickS').currentTime=0;
        document.getElementById('clickS').play().catch(()=>{});

        setTimeout(()=>{

        window.location.href='https://github.com/ElPanaHotDog/Free-Cam-Mod/releases/download/1.3.9.1/FreeCam_V1.3.9.1.zip'

        },150)
        ">

            Download

        </button>




        <button class="download"

        onmouseenter="
        document.getElementById('hoverS').currentTime=0;
        document.getElementById('hoverS').play().catch(()=>{})
        "

        onclick="
        document.getElementById('clickS').currentTime=0;
        document.getElementById('clickS').play().catch(()=>{});

        setTimeout(()=>{

        window.location.href='https://elpanahotdog.github.io/ElPanaHotDog.io/status'

        },150)
        ">

            Player Status

        </button>

        <button class="download"

onmouseenter="
document.getElementById('hoverS').currentTime=0;
document.getElementById('hoverS').play().catch(()=>{})
"

onclick="
document.getElementById('clickS').currentTime=0;
document.getElementById('clickS').play().catch(()=>{});

setTimeout(()=>{

window.open('https://github.com/ElPanaHotDog/Free-Cam-Mod','_blank')

},150)
">

    More Information

</button>


    </div>


</div>

<img class="hero-render" src="Icon.png">

</div>


    <div class="gallery">


        <img src="Image1.png">


        <img src="Image2.png">


        <img src="Image3.png">


    </div>



</div>

<audio id="hoverS" src="PopUp.wav"></audio>

<audio id="clickS" src="Accept.wav"></audio>


</body>

</html>
